# 仅构建并部署网站：main 有推送时触发，不采集、不调用 AI，也不跑 Python 测试。
name: Build News Website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      # 排队的任务构建的是最新 main，而不是触发事件当时的旧提交
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # 记下构建所用的提交，部署 job 据此核对
      - name: Record built commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate and build website
        run: bash scripts/validate-site.sh
      - uses: actions/configure-pages@v6
      - name: Verify release still matches main
        run: bash scripts/check-release.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - name: Recheck main immediately before deployment
        run: bash scripts/check-release.sh --check-only
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report failed deployment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Site deployment failed: $(date -u +%F)" \
            --body "Deployment failed or was superseded: $RUN_URL." \
            || echo "::warning::Could not open a failure issue"
