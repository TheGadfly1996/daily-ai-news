name: Daily News Summary

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Issue date YYYY-MM-DD (ends at 08:17 Asia/Shanghai); empty = latest completed window"
        required: false
        type: string
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt
      - name: Test generation and RSS handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate candidate digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ISSUE_DATE: ${{ inputs.issue_date }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ISSUE_DATE" ]]; then args+=(--date "$ISSUE_DATE"); fi
          python generate.py "${args[@]}"
      - name: Validate candidate and build before committing
        run: bash scripts/validate-site.sh
      - name: Save only validated history
        run: bash scripts/publish-history.sh
      - uses: actions/configure-pages@v6
      - name: Verify release still matches main
        run: bash scripts/check-release.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Recheck main immediately before deployment
        run: bash scripts/check-release.sh
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Retain generation diagnostics and candidate data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-run-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .runs/
            data/digests.json
            data/runs/
          retention-days: 14
