# 每日新闻：生成当期（并补齐缺失期号）→ 验证 → 提交数据 → 部署 Pages。
# build job 持有 API Key 并可推送数据，deploy job 只有 Pages 权限。
name: Daily News Summary

on:
  workflow_dispatch:
    inputs:
      issue_date:   # 手动补跑指定期号；留空则生成最近已结束的窗口
        description: "Issue date YYYY-MM-DD (ends at 08:17 Asia/Shanghai); empty = latest completed window"
        required: false
        type: string
      force:        # 该期已存在时仍重新生成并替换
        description: "Regenerate and replace the issue even if it already exists"
        required: false
        type: boolean
        default: false
  schedule:
    # 使用默认 UTC：00:17 UTC = 北京时间 08:17。
    # schedule 可能被 GitHub 延迟；固定采集窗口不随实际启动时间移动。
    - cron: "17 0 * * *"
    # 补跑时段：generate.py 遇到已存在的期号会跳过，所以第一次成功后这次不会产生新提交，也不会重复部署
    # 01:47 UTC = 北京时间 09:47。
    - cron: "47 1 * * *"

# 默认只读，各 job 按需申请权限（最小权限原则）
permissions:
  contents: read

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  build:
    # 持有 API Key 并可向 main 推送数据，但不能发布到 Pages
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # 记下起始提交，用于判断本次运行是否产生了新数据
      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt
      # 先跑 Python 测试，再调用模型，避免带着坏代码消耗 API 额度
      - name: Test generation and RSS handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate candidate digest
        # 最新一期最坏约 42 分钟：7 次请求 × 2 次尝试 × SDK 2 次调用 × 90 秒。
        # 补齐缺失期号只在开始后 15 分钟内启动（backfill_start_deadline_seconds）。
        timeout-minutes: 60
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ISSUE_DATE: ${{ inputs.issue_date }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ISSUE_DATE" ]]; then args+=(--date "$ISSUE_DATE"); fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python generate.py "${args[@]}"
      # 先验证再提交：类型检查、测试、构建全部通过才会写入 main
      - name: Validate candidate and build before committing
        run: bash scripts/validate-site.sh
      # 仅在 main 没有被他人更新时推送；冲突则失败，候选数据保留在 artifact 中
      - name: Save only validated history
        run: bash scripts/publish-history.sh
      - name: Decide whether to deploy
        id: release
        shell: bash
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # 定时补跑发现该期已发布、没有新提交时，跳过重复部署
          if [[ "$EVENT" == "schedule" && "$(git rev-parse HEAD)" == "$START_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release still matches main
        if: steps.release.outputs.deploy == 'true'
        run: bash scripts/check-release.sh
      - uses: actions/configure-pages@v6
        if: steps.release.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.deploy == 'true'
        with:
          path: dist
      # 无论成败都保留诊断信息与候选数据 14 天
      - name: Retain generation diagnostics and candidate data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-run-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .runs/
            data/digests/
            data/runs/
          retention-days: 14
      # 失败时自动开 Issue（需要 issues: write 权限）
      - name: Report failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Daily news failed: $(date -u +%F)" \
            --body "Run failed: $RUN_URL. Diagnostics are in the run artifact. Re-run with the issue_date input after fixing." \
            || echo "::warning::Could not open a failure issue"

  deploy:
    # 只有 Pages/OIDC 权限：没有仓库写权限，也拿不到 API Key
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      # 检出构建时的提交，部署前最后核对一次 main 是否已被更新
      - name: Recheck main immediately before deployment
        run: bash scripts/check-release.sh --check-only
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report failed deployment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Pages deployment failed: $(date -u +%F)" \
            --body "Deployment failed or was superseded: $RUN_URL. Data may already be on main; rerun this workflow." \
            || echo "::warning::Could not open a failure issue"
